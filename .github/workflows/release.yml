name: Build Master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.aif'
      - '.github/workflows/release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/upload-artifact@v4
        with:
          name: master
          path: master.wav
      - shell: bash
        run: |
          i=0
          for f in *.aif; do
            inputs+=(-i "$f")
            filters+="[$i:a]"
            i=$((i + 1))
          done
          ffmpeg "${inputs[@]}" -filter_complex \
            "${filters}amix=inputs=$i:normalize=0" master.wav


