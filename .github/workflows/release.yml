name: Build Master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.aif']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          for f in *.aif; do
            inputs+=(-i "$f")
            filters+="[$((i++)):a]"
          done
          ffmpeg "${inputs[@]}" -filter_complex \
            "${filters}amix=inputs=$i:normalize=0" master.wav
        shell: bash
