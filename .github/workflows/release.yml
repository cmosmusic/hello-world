name: Build Master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.aif'
      - '**.wav'
      - '.github/workflows/release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - shell: bash
        run: |
          i=0
          for f in *.aif *.wav; do
            [ -f "$f" ] || continue
            inputs+=(-i "$f")
            filters+="[$i:a]"
            i=$((i + 1))
          done
          ffmpeg "${inputs[@]}" -filter_complex \
          "${filters}amix=inputs=$i:normalize=0" "${{ github.event.repository.name }}_${{ github.sha }}.wav"

      - uses: actions/upload-artifact@v5
        with:
          name: master
          path: "${{ github.event.repository.name }}_${{ github.sha }}.wav"
